syntax = "proto3";

package dusk.v1alpha1;

import "dusk/v1alpha1/entity.proto";
import "google/protobuf/struct.proto";

option go_package = "github.com/NerdsWhoFish/dusk-plugin-sdk/gen/dusk/v1alpha1;duskv1alpha1";

// ActionClass is a closed enum on purpose, unlike Entity.kind. It is semantic
// rather than taxonomic: it drives safety defaults, so its values must mean
// the same thing to every plugin and every install.
enum ActionClass {
  ACTION_CLASS_UNSPECIFIED = 0;
  ACTION_CLASS_READ_ONLY = 1;
  ACTION_CLASS_MUTATING = 2;
  ACTION_CLASS_DESTRUCTIVE = 3;
}

// ActionDescriptor declares one invocable action.
//
// Declaring an action does not enable it. Actions are denied by default and
// enabled explicitly at install time.
message ActionDescriptor {
  string name = 1;
  string description = 2;
  ActionClass class = 3;

  // JSON Schema for params.
  google.protobuf.Struct params_schema = 4;

  // Which Dusk read yields a proof token satisfying this action, e.g. "get".
  // Without this an agent meets the read-before-write contract blind.
  string proof_from = 5;

  // When true, Invoke returns a handle and completion is polled via Status.
  bool async = 6;

  // Entity kinds this action applies to. Empty means plugin-scoped.
  repeated string applies_to_kinds = 7;
}

// ConfigFieldType is closed: Dusk renders a form from it, so an unknown type
// has no rendering.
enum ConfigFieldType {
  CONFIG_FIELD_TYPE_UNSPECIFIED = 0;
  CONFIG_FIELD_TYPE_STRING = 1;
  CONFIG_FIELD_TYPE_INT = 2;
  CONFIG_FIELD_TYPE_BOOL = 3;
  CONFIG_FIELD_TYPE_ENUM = 4;
  CONFIG_FIELD_TYPE_DURATION = 5;
}

// ConfigField is one setting in the plugin's admin form.
message ConfigField {
  string name = 1;
  string label = 2;
  string help = 3;
  ConfigFieldType type = 4;
  bool required = 5;
  string default_value = 6;

  // Allowed values when type is ENUM.
  repeated string enum_values = 7;

  // RE2 pattern validated by Dusk before the value is stored.
  string pattern = 8;

  // Sensitive values are stored encrypted, never returned by any read, and
  // never written to the config repo. A first-class field rather than a schema
  // annotation, because an author who forgets this leaks a credential.
  bool sensitive = 9;
}

message DescribeRequest {}

message DescribeResponse {
  string plugin_id = 1;
  string version = 2;
  string schema_version = 3;

  // Entity kinds this plugin may emit.
  repeated string emits_kinds = 4;

  repeated ActionDescriptor actions = 5;
  repeated ConfigField config_fields = 6;
}

message ValidateConfigRequest {
  google.protobuf.Struct config = 1;
}

// ValidateConfigResponse reports whether the configuration actually works, so
// a bad credential fails where it was entered rather than as a mysterious
// ingest failure later.
message ValidateConfigResponse {
  bool ok = 1;
  string message = 2;

  // Field name to error, for anything attributable to one field.
  map<string, string> field_errors = 3;
}

message IngestRequest {
  google.protobuf.Struct config = 1;
}

// IngestResponse is the gRPC envelope around a batch. IngestBatch itself stays
// the Tier 1 stdout format, so the two can evolve independently.
message IngestResponse {
  IngestBatch batch = 1;
}

// DryRunRequest carries no proof token: previewing is not mutating, so the
// read-before-write gate does not apply.
message DryRunRequest {
  string ref = 1;
  string action = 2;
  google.protobuf.Struct params = 3;
}

// DryRunResponse makes "not supported" explicit rather than absent. Dry run is
// required of every action; supported=false is a valid answer, and Dusk
// surfaces it at approval time so a human knows a destructive action cannot
// be previewed.
message DryRunResponse {
  bool supported = 1;
  string summary = 2;
  google.protobuf.Struct detail = 3;
}

message InvokeRequest {
  // Entity ref. Actions are entity-scoped so the target is a catalog
  // identity rather than a free-form string.
  string ref = 1;

  string action = 2;
  google.protobuf.Struct params = 3;

  // Opaque, issued by Dusk. Plugins do not validate it; Dusk does.
  string proof_token = 4;
}

message InvokeResponse {
  // Set when the action is async; poll Status with it.
  string handle = 1;

  bool done = 2;
  bool ok = 3;
  string message = 4;
  google.protobuf.Struct detail = 5;
}

message StatusRequest {
  string handle = 1;
}

message StatusResponse {
  bool done = 1;
  bool ok = 2;
  string message = 3;
  google.protobuf.Struct detail = 4;
}

// PluginService is the Tier 2 contract, served over gRPC on a unix socket the
// host provides. Tier 1 ingesters implement none of this: they exec, write an
// IngestBatch as protojson to stdout, and exit.
service PluginService {
  rpc Describe(DescribeRequest) returns (DescribeResponse);
  rpc ValidateConfig(ValidateConfigRequest) returns (ValidateConfigResponse);
  rpc Ingest(IngestRequest) returns (stream IngestResponse);
  rpc DryRun(DryRunRequest) returns (DryRunResponse);
  rpc Invoke(InvokeRequest) returns (InvokeResponse);
  rpc Status(StatusRequest) returns (StatusResponse);
}
