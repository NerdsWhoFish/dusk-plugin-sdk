syntax = "proto3";

package dusk.v1alpha1;

import "dusk/v1alpha1/entity.proto";
import "google/protobuf/struct.proto";

option go_package = "github.com/NerdsWhoFish/dusk-plugin-sdk/gen/dusk/v1alpha1;duskv1alpha1";

// ActionClass is a closed enum on purpose, unlike Entity.kind. It is semantic
// rather than taxonomic: it drives safety defaults, so its values must mean
// the same thing to every plugin and every install.
enum ActionClass {
  ACTION_CLASS_UNSPECIFIED = 0;
  ACTION_CLASS_READ_ONLY = 1;
  ACTION_CLASS_MUTATING = 2;
  ACTION_CLASS_DESTRUCTIVE = 3;
}

// ActionDescriptor declares one invocable action.
//
// Declaring an action does not enable it. Actions are denied by default and
// enabled explicitly at install time.
message ActionDescriptor {
  string name = 1;
  string description = 2;
  ActionClass class = 3;

  // JSON Schema for params.
  google.protobuf.Struct params_schema = 4;

  // Which Dusk read yields a proof token satisfying this action, e.g. "get".
  // Without this an agent meets the read-before-write contract blind.
  string proof_from = 5;

  // When true, Invoke returns a handle and completion is polled via Status.
  bool async = 6;

  // Entity kinds this action applies to. Empty means plugin-scoped.
  repeated string applies_to_kinds = 7;

  // Then declares what this action may ask Dusk to run after it.
  //
  // A plugin composes by naming a catalog ref rather than by dialing another
  // plugin's socket, so approval covers the whole chain before anything runs
  // and every step is recorded. An invocation may only return follow-on steps
  // whose action names appear here: without that, approving a chain would mean
  // approving whatever the plugin decided to append once it was running.
  repeated Next then = 8;
}

// Next is one step in a composition: an action to run after the one declaring
// or returning it, named by catalog ref rather than by reaching for a socket.
message Next {
  // Ref of the entity the step targets. Empty means the entity the invocation
  // that produced this step was itself targeting.
  string ref = 1;

  string action = 2;

  // Params are set when a step is returned by an invocation, which is the
  // point at which the concrete arguments are known. A declared step leaves
  // them empty: it states what may follow, not with what.
  google.protobuf.Struct params = 3;
}

// ConfigFieldType is closed: Dusk renders a form from it, so an unknown type
// has no rendering.
enum ConfigFieldType {
  CONFIG_FIELD_TYPE_UNSPECIFIED = 0;
  CONFIG_FIELD_TYPE_STRING = 1;
  CONFIG_FIELD_TYPE_INT = 2;
  CONFIG_FIELD_TYPE_BOOL = 3;
  CONFIG_FIELD_TYPE_ENUM = 4;
  CONFIG_FIELD_TYPE_DURATION = 5;
}

// ConfigField is one setting in the plugin's admin form.
message ConfigField {
  string name = 1;
  string label = 2;
  string help = 3;
  ConfigFieldType type = 4;
  bool required = 5;
  string default_value = 6;

  // Allowed values when type is ENUM.
  repeated string enum_values = 7;

  // RE2 pattern validated by Dusk before the value is stored.
  string pattern = 8;

  // Sensitive values are stored encrypted, never returned by any read, and
  // never written to the config repo. A first-class field rather than a schema
  // annotation, because an author who forgets this leaks a credential.
  bool sensitive = 9;
}

message DescribeRequest {}

// SourceBudget is how a plugin says several of its configurations draw on one
// upstream quota, so two of them observing one server queue behind each other
// and two observing different servers do not (ADR-0011).
//
// Dusk meters runs rather than requests. It starts an observation; what a
// plugin then does upstream happens inside the plugin's own process and is not
// visible to the host, so a request count would be a number Dusk could not
// hold itself to.
message SourceBudget {
  // KeyFields names the config fields whose values identify the upstream
  // system. Empty means every configuration is its own source, which is the
  // safe default: a plugin that has not thought about this is not throttled by
  // accident.
  repeated string key_fields = 1;

  // MaxConcurrent is how many runs may be in flight against one source. Zero
  // means one, because two observations of one system racing is rarely what
  // anybody wanted.
  int32 max_concurrent = 2;

  // MinSpacingSeconds is how long Dusk leaves between two runs against one
  // source. Zero means none.
  int32 min_spacing_seconds = 3;
}

message DescribeResponse {
  string plugin_id = 1;
  string version = 2;
  string schema_version = 3;

  // Entity kinds this plugin may emit.
  repeated string emits_kinds = 4;

  repeated ActionDescriptor actions = 5;
  repeated ConfigField config_fields = 6;
  repeated UIContribution ui = 7;

  SourceBudget budget = 8;
}

// UISlot names where a contribution mounts.
enum UISlot {
  // Unspecified is the entity page, which is where a view about a thing goes
  // and was the only slot before there was a choice.
  UI_SLOT_UNSPECIFIED = 0;
  UI_SLOT_ENTITY = 1;

  // Plugin is the plugin's own page in the admin UI, which is where a view
  // that is about the plugin rather than about one entity belongs. Creating
  // something the plugin does not observe yet has no entity to mount against.
  UI_SLOT_PLUGIN = 2;
}

// ViewLayout is closed, because Dusk renders it. An unknown layout has no
// rendering, and a vocabulary that grows by release is the point: this is
// deliberately not a layout language (ADR-0020).
enum ViewLayout {
  VIEW_LAYOUT_UNSPECIFIED = 0;

  // Table is one row per entity, one column per field.
  VIEW_LAYOUT_TABLE = 1;

  // List is one line per entity, fields joined.
  VIEW_LAYOUT_LIST = 2;

  // Badges is every field of one entity as a labelled chip.
  VIEW_LAYOUT_BADGES = 3;
}

// ViewFormat is how one field is drawn.
enum ViewFormat {
  VIEW_FORMAT_UNSPECIFIED = 0;
  VIEW_FORMAT_TEXT = 1;

  // Code is monospaced, for identifiers and refs.
  VIEW_FORMAT_CODE = 2;

  // Badge is a chip, for a short status word.
  VIEW_FORMAT_BADGE = 3;

  // Link routes to the entity the value names, which only makes sense when
  // the value is a ref.
  VIEW_FORMAT_LINK = 4;

  // Timestamp renders an RFC 3339 value as a readable time.
  VIEW_FORMAT_TIMESTAMP = 5;
}

// ViewField is one thing a declared view shows.
message ViewField {
  // Source names what to read. The reserved names ref, kind, namespace, name,
  // title and description read the entity's own fields; anything else is an
  // attribute key.
  string source = 1;

  // Label is the column heading or chip label. Empty falls back to source.
  string label = 2;

  ViewFormat format = 3;
}

// ViewSpec is a view Dusk renders with its own React, from a description
// rather than from a plugin's JavaScript. It is ADR-0020's tier 1: no asset,
// no shadow DOM, no trust decision, and it is what most plugins should use.
message ViewSpec {
  ViewLayout layout = 1;
  repeated ViewField fields = 2;

  // Empty is what to say when there is nothing to show, in the plugin's own
  // words. "No pods are running here" beats a generic blank.
  string empty = 3;
}

// UIContribution is a view a plugin contributes.
//
// It is either declared, by setting spec, or drawn by the plugin itself, by
// setting element and asset. Declared is tier 1 and needs no trust decision;
// an element is tier 2 and runs JavaScript in Dusk's origin (ADR-0020).
message UIContribution {
  // Element is the custom element tag, which must contain a hyphen.
  string element = 1;

  // Asset names the JavaScript to fetch with GetAsset. It defines the element.
  string asset = 2;

  // AppliesToKinds limits where it mounts. Empty means every entity this
  // plugin emits, which is the common case.
  repeated string applies_to_kinds = 3;

  // Title labels the block the view is rendered in.
  string title = 4;

  UISlot slot = 5;

  // Spec makes this a declared view. Set it or set element and asset, never
  // both: two renderings of one contribution is one too many.
  ViewSpec spec = 6;
}

message ValidateConfigRequest {
  google.protobuf.Struct config = 1;
}

// ValidateConfigResponse reports whether the configuration actually works, so
// a bad credential fails where it was entered rather than as a mysterious
// ingest failure later.
message ValidateConfigResponse {
  bool ok = 1;
  string message = 2;

  // Field name to error, for anything attributable to one field.
  map<string, string> field_errors = 3;
}

message IngestRequest {
  google.protobuf.Struct config = 1;
}

// IngestResponse is the gRPC envelope around a batch. IngestBatch itself stays
// the Tier 1 stdout format, so the two can evolve independently.
message IngestResponse {
  IngestBatch batch = 1;
}

// DryRunRequest carries no proof token: previewing is not mutating, so the
// read-before-write gate does not apply.
message DryRunRequest {
  string ref = 1;
  string action = 2;
  google.protobuf.Struct params = 3;

  // Config is the configuration of the instance that observed this entity, not
  // the plugin's first one. A plugin watching two clusters must act on the one
  // the target actually lives in.
  google.protobuf.Struct config = 4;
}

// DryRunResponse makes "not supported" explicit rather than absent. Dry run is
// required of every action; supported=false is a valid answer, and Dusk
// surfaces it at approval time so a human knows a destructive action cannot
// be previewed.
message DryRunResponse {
  bool supported = 1;
  string summary = 2;
  google.protobuf.Struct detail = 3;
}

message InvokeRequest {
  // Entity ref. Actions are entity-scoped so the target is a catalog
  // identity rather than a free-form string. Empty for a plugin-scoped action,
  // which is one that is not about a single entity.
  string ref = 1;

  string action = 2;
  google.protobuf.Struct params = 3;

  // Opaque, issued by Dusk. Plugins do not validate it; Dusk does.
  string proof_token = 4;

  // Config is the configuration of the instance that observed this entity, not
  // the plugin's first one. A plugin watching two clusters must act on the one
  // the target actually lives in.
  google.protobuf.Struct config = 5;

  // Elicited carries the answers to a previous Elicit, and is set only when
  // resuming one. A plugin that asked and was answered is invoked again with
  // the same params plus this.
  Elicited elicited = 6;
}

// Elicit is a plugin asking the human a structured question mid-action. It is
// returned rather than called, so a surface with nobody attached refuses it
// instead of hanging (ADR-0046).
message Elicit {
  // Prompt is what the person is asked, in their language rather than the
  // plugin's. It is shown above the fields.
  string prompt = 1;

  // Schema is a JSON Schema object describing the fields wanted. Flat objects
  // of primitives only, which is all the MCP elicitation contract carries.
  google.protobuf.Struct schema = 2;

  // Token is opaque to Dusk and returned verbatim, so a plugin can resume
  // without keeping the half-finished call in memory.
  string token = 3;
}

// Elicited is the answer to an Elicit, including the ways it can be refused.
message Elicited {
  // Token is whatever the Elicit carried.
  string token = 1;

  // Values are the fields the person supplied, empty unless accepted.
  google.protobuf.Struct values = 2;

  // Outcome is accept, decline or cancel. Declining is a considered no and
  // cancelling is walking away, and a plugin may care which.
  string outcome = 3;
}

message InvokeResponse {
  // Set when the action is async; poll Status with it.
  string handle = 1;

  bool done = 2;
  bool ok = 3;
  string message = 4;
  google.protobuf.Struct detail = 5;

  // Then asks Dusk to run further actions, each of which it resolves, approves
  // and invokes itself. Only action names the descriptor already declared in
  // its own `then` are accepted, so a chain cannot grow past what was approved.
  repeated Next then = 6;

  // Observed names entity refs this invocation changed, so the catalog can
  // refresh them rather than serving what it saw before the action ran.
  repeated string changed = 7;

  // Elicit asks for input and ends this turn. Nothing else in the response is
  // acted on: no chain runs and no refresh happens, because the action has not
  // finished. Dusk asks, then invokes again with the answer (ADR-0046).
  Elicit elicit = 8;
}

message StatusRequest {
  string handle = 1;
}

message StatusResponse {
  bool done = 1;
  bool ok = 2;
  string message = 3;
  google.protobuf.Struct detail = 4;
}

message GetAssetRequest {
  string name = 1;
}

// GetAssetResponse streams the asset in chunks rather than returning one bytes
// field. gRPC's send limit is unbounded and its receive limit defaults to 4MB,
// so a plugin embedding a large bundle would send it happily and have the host
// reject it. Chunking has no size to guess at.
message GetAssetResponse {
  bytes chunk = 1;
}

// PluginService is the contract, served over gRPC on a unix socket the host
// provides. There is no second transport (ADR-0039).
service PluginService {
  rpc Describe(DescribeRequest) returns (DescribeResponse);
  rpc ValidateConfig(ValidateConfigRequest) returns (ValidateConfigResponse);
  rpc Ingest(IngestRequest) returns (stream IngestResponse);
  rpc DryRun(DryRunRequest) returns (DryRunResponse);
  rpc Invoke(InvokeRequest) returns (InvokeResponse);
  rpc Status(StatusRequest) returns (StatusResponse);

  // GetAsset serves the JavaScript a UI contribution names. Dusk serves it
  // from its own origin, so a plugin's view never reaches the network.
  rpc GetAsset(GetAssetRequest) returns (stream GetAssetResponse);
}
